  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1240, &quot;height&quot;: 900}}\">\nclass Component extends DCLogic {\n  state = { problem: \"\", step: \"idle\" };\n\n  score(text) {\n    const t = (text || \"\").toLowerCase();\n    const has = (arr) => arr.reduce((n, w) => n + (t.includes(w) ? 1 : 0), 0);\n    return {\n      love:    has([\"relationship\",\"love\",\"partner\",\"marriage\",\"dating\",\"ex\",\"heart\",\"breakup\",\"romance\",\"soulmate\",\"commit\"]),\n      career:  has([\"career\",\"job\",\"work\",\"purpose\",\"money\",\"business\",\"path\",\"direction\",\"calling\",\"behind\",\"success\",\"decision\",\"stuck\"]),\n      healing: has([\"anxiety\",\"stress\",\"heal\",\"grief\",\"sleep\",\"panic\",\"overwhelm\",\"tired\",\"burnout\",\"depress\",\"body\",\"fear\",\"calm\",\"peace\",\"energy\"]),\n      timing:  has([\"future\",\"timing\",\"year\",\"when\",\"2026\",\"transit\",\"move\",\"change\",\"destiny\",\"chart\"]),\n    };\n  }\n\n  renderVals() {\n    const { problem, step } = this.state;\n    const words = problem.trim() ? problem.trim().split(/\\s+/).length : 0;\n    const sc = this.score(problem);\n\n    // pick dominant theme\n    const entries = Object.entries(sc).sort((a, b) => b[1] - a[1]);\n    const top = entries[0][1] > 0 ? entries[0][0] : \"self\";\n    const themeLabels = { love: \"relationship\", career: \"purpose & career\", healing: \"healing\", timing: \"timing\", self: \"self-discovery\" };\n    const intros = {\n      love: \"Your words point to matters of the heart and connection — patterns in who you meet and why. These guides work exactly there.\",\n      career: \"You're weighing direction, purpose and timing. These practitioners help you read what your chart says you're here to do.\",\n      healing: \"There's a lot to hold right now. These guides focus on release, grounding and restoring your energy.\",\n      timing: \"You're asking about timing and what's ahead. These readers map cycles and transits so the road feels less blind.\",\n      self: \"From what you shared, here are the guides best placed to help you understand yourself more deeply.\",\n    };\n\n    const ox = \"linear-gradient(135deg,#47101F,#6E1F2E)\";\n    const roster = {\n      love:   { initial: \"M\", name: \"Mira Sol\", specialty: \"VEDIC & WESTERN ASTROLOGER\", why: \"reads relationship patterns through your composite chart and Venus placements — the 'why does this keep happening' question is her specialty.\", rating: \"4.9\", reviews: \"212\", duration: \"45 min\", price: \"$80\", photo: ox },\n      career: { initial: \"A\", name: \"Adri Vale\", specialty: \"NUMEROLOGIST\", why: \"decodes your life-path and personal-year numbers into a clear sense of direction and timing for the decision you're weighing.\", rating: \"5.0\", reviews: \"156\", duration: \"30 min\", price: \"$60\", photo: \"linear-gradient(135deg,#6E1F2E,#8A2436)\" },\n      healing:{ initial: \"L\", name: \"Lena Cross\", specialty: \"ENERGY · REIKI\", why: \"runs distance energy sessions for release, grounding and sleep — gentle, body-first work for exactly what you're carrying.\", rating: \"4.9\", reviews: \"140\", duration: \"50 min\", price: \"$75\", photo: \"linear-gradient(135deg,#2E1533,#4A2452)\" },\n      timing: { initial: \"K\", name: \"Kai Renn\", specialty: \"HUMAN DESIGN GUIDE\", why: \"maps your strategy and authority so upcoming changes feel like decisions you can trust rather than guesswork.\", rating: \"4.8\", reviews: \"98\", duration: \"60 min\", price: \"$95\", photo: \"linear-gradient(135deg,#12352E,#1C5047)\" },\n      self:   { initial: \"A\", name: \"Adri Vale\", specialty: \"NUMEROLOGIST\", why: \"starts with your core numbers — a grounded first reading when you're not sure where to begin.\", rating: \"5.0\", reviews: \"156\", duration: \"30 min\", price: \"$60\", photo: \"linear-gradient(135deg,#6E1F2E,#8A2436)\" },\n    };\n    // ordered by score, always 3, unique\n    const order = entries.map(e => e[0]).filter(k => sc[k] > 0);\n    const keys = [...new Set([...(order.length ? order : [\"self\"]), \"love\", \"career\", \"healing\", \"timing\"])].slice(0, 3);\n    const scoreLabels = [\"Top match\", \"Strong fit\", \"Also great\"];\n    const matches = keys.map((k, i) => ({ ...roster[k], score: scoreLabels[i] }));\n\n    return {\n      problem,\n      wordCount: words,\n      countColor: words > 300 ? \"#8A1B2E\" : (words >= 40 ? \"#1E6E5C\" : \"#9A8672\"),\n      isMatching: step === \"matching\",\n      isMatched: step === \"matched\",\n      themeLabel: themeLabels[top],\n      matchIntro: intros[top],\n      matches,\n      onProblem: (e) => this.setState({ problem: e.target.value }),\n      onChipLove: () => this.setState({ problem: \"I keep ending up in the same kind of relationship and I don't understand the pattern. I want to know what my chart says about love and timing.\" }),\n      onChipCareer: () => this.setState({ problem: \"I've just turned 30 and feel behind in my career. I'm unsure whether to change paths and what I'm actually here to do.\" }),\n      onChipHealing: () => this.setState({ problem: \"I've been carrying a lot of anxiety and I'm exhausted. I struggle to sleep and want to feel grounded and calm again.\" }),\n      onMatch: () => {\n        this.setState({ step: \"matching\" });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ step: \"matched\" }), 2000);\n      },\n      onReset: () => this.setState({ step: \"idle\", problem: \"\" }),\n\n      courses: [\n        { num: \"1\", tag: \"Bestseller\", meta: \"12 LESSONS · 3H\", title: \"Numerology Foundations\", by: \"Adri Vale\", rating: \"4.9\", price: \"$49\", thumb: \"repeating-linear-gradient(135deg,#47101F,#47101F 8px,#521326 8px,#521326 16px)\" },\n        { num: \"\\u2609\", tag: \"New\", meta: \"18 LESSONS · 5H\", title: \"Reading Your Birth Chart\", by: \"Mira Sol\", rating: \"4.8\", price: \"$59\", thumb: \"repeating-linear-gradient(135deg,#3A2A0D,#3A2A0D 8px,#4A360F 8px,#4A360F 16px)\" },\n        { num: \"\\u0950\", tag: \"Vedic\", meta: \"16 LESSONS · 4H\", title: \"Intro to Vedic Astrology\", by: \"Ravi Nair\", rating: \"4.9\", price: \"$69\", thumb: \"repeating-linear-gradient(135deg,#3A1508,#3A1508 8px,#4A1C0C 8px,#4A1C0C 16px)\" },\n        { num: \"\\u2721\", tag: \"Guided\", meta: \"14 LESSONS · 4H\", title: \"Tarot as a Mirror\", by: \"Lena Cross\", rating: \"4.7\", price: \"$45\", thumb: \"repeating-linear-gradient(135deg,#2E1533,#2E1533 8px,#3A1A40 8px,#3A1A40 16px)\" },\n      ],\n      meditations: [\n        { hz: \"528 HZ\", len: \"12 MIN\", title: \"Heart Repair\", price: \"$8\", thumb: \"radial-gradient(circle at 50% 40%,#2E6B5E,#12352E)\" },\n        { hz: \"432 HZ\", len: \"20 MIN\", title: \"Grounding Before Sleep\", price: \"$8\", thumb: \"radial-gradient(circle at 50% 40%,#264A6B,#12243A)\" },\n        { hz: \"396 HZ\", len: \"15 MIN\", title: \"Releasing Fear\", price: \"Free\", thumb: \"radial-gradient(circle at 50% 40%,#5A3A6B,#2E1533)\" },\n        { hz: \"639 HZ\", len: \"18 MIN\", title: \"Opening to Connection\", price: \"$8\", thumb: \"radial-gradient(circle at 50% 40%,#6B3A4A,#3A1522)\" },\n      ],\n      readers: [\n        { initial: \"M\", name: \"Mira Sol\", specialty: \"VEDIC & WESTERN ASTROLOGER\", blurb: \"Charts, transits and timing — warm, precise, no fluff.\", rating: \"4.9\", reviews: \"212\", duration: \"45 min\", availability: \"Available today\", price: \"$80\", photo: ox },\n        { initial: \"A\", name: \"Adri Vale\", specialty: \"NUMEROLOGIST\", blurb: \"Life-path, name and birth-date decoding you can act on.\", rating: \"5.0\", reviews: \"156\", duration: \"30 min\", availability: \"Tomorrow, 10am\", price: \"$60\", photo: \"linear-gradient(135deg,#6E1F2E,#8A2436)\" },\n        { initial: \"K\", name: \"Kai Renn\", specialty: \"HUMAN DESIGN GUIDE\", blurb: \"Bodygraph readings — your strategy, authority and type.\", rating: \"4.8\", reviews: \"98\", duration: \"60 min\", availability: \"Available today\", price: \"$95\", photo: \"linear-gradient(135deg,#12352E,#1C5047)\" },\n        { initial: \"L\", name: \"Lena Cross\", specialty: \"ENERGY · REIKI\", blurb: \"Distance sessions for cleansing, release and grounding.\", rating: \"4.9\", reviews: \"140\", duration: \"50 min\", availability: \"Friday, 2pm\", price: \"$75\", photo: \"linear-gradient(135deg,#2E1533,#4A2452)\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
